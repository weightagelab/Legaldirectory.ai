<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login with OTP - Legaldirectory.ai</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #07080e;
            color: #f3f4f6;
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #0d0f18;
            border: 1px solid #252a3d;
            border-radius: 8px;
            padding: 38px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6);
        }
        .header { margin-bottom: 24px; }
        .tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #3b82f6; letter-spacing: 1.5px; margin-bottom: 8px; text-transform: uppercase; }
        h2 { font-size: 27px; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: #8b92a5; margin-top: 4px; line-height: 1.6; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8b92a5; letter-spacing: 1px; margin-bottom: 6px; text-transform: uppercase; }
        input[type="text"], input[type="email"], input[type="tel"] {
            width: 100%;
            padding: 11px 14px;
            background: #12141f;
            border: 1px solid #252a3d;
            border-radius: 8px;
            color: #f3f4f6;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s;
        }
        input:focus { border-color: #3b82f6; }
        input::placeholder { color: #8b92a5; }
        .phone-wrap {
            display: flex;
            align-items: center;
            background: #12141f;
            border: 1px solid #252a3d;
            border-radius: 8px;
            overflow: hidden;
        }
        .phone-flag {
            padding: 11px 12px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            color: #8b92a5;
            border-right: 1px solid #252a3d;
            white-space: nowrap;
            background: #181b28;
        }
        .phone-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #f3f4f6;
            font-size: 15px;
            padding: 11px 14px;
        }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #072654, #0a3276);
            border: 1.5px solid rgba(59, 130, 246, 0.4);
            border-radius: 5px;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            padding: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            margin-top: 6px;
        }
        .btn:hover { background: linear-gradient(135deg, #0a3276, #0e42a0); box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .google-btn { background: #fff; color: #3c4043; border: 1.5px solid #dadce0 !important; margin-bottom: 10px; }
        .google-btn:hover { background: #f8f9fa; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0 14px; color: #8b92a5; font-family: 'JetBrains Mono', monospace; font-size: 10px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #1e2235; }
        .status { margin-top: 12px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; min-height: 18px; color: #ef4444; }
        .status.success { color: #22c55e; }
        .otp-inputs { display: flex; gap: 8px; justify-content: center; margin: 14px 0; }
        .otp-box {
            width: 44px; height: 52px; border-radius: 6px; text-align: center;
            font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 600; color: #f3f4f6;
            background: #12141f; border: 1.5px solid #252a3d; outline: none;
            transition: border-color 0.15s;
        }
        .otp-box:focus { border-color: #3b82f6; }
        .hidden { display: none !important; }
        .otp-label { text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b92a5; margin-bottom: 12px; }
        .back-btn { background: none; border: none; color: #8b92a5; font-family: 'JetBrains Mono', monospace; font-size: 10px; cursor: pointer; margin-top: 10px; display: block; width: 100%; text-align: center; }
        /* TABS */
        .tabs { display: flex; background: #12141f; border: 1px solid #252a3d; border-radius: 7px; padding: 4px; margin-bottom: 22px; gap: 4px; }
        .tab-btn { flex: 1; padding: 9px; border: none; border-radius: 5px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; background: transparent; color: #8b92a5; transition: all 0.18s; }
        .tab-btn.active { background: #0a3276; color: #fff; border: 1px solid rgba(59,130,246,0.4); box-shadow: 0 2px 8px rgba(59,130,246,0.2); }
        .tab-btn:hover:not(.active) { color: #c4cde0; background: rgba(255,255,255,0.04); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="tag">CLIENT ACCESS · SECURE LOGIN</div>
            <h2>Sign In</h2>
            <p class="subtitle">Access your Legaldirectory.ai account to track your service status and documents.</p>
        </div>

        <!-- GOOGLE BUTTON -->
        <button class="btn google-btn" id="google-signin-btn" onclick="signInWithGoogle()">
            <svg width="19" height="19" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19.1 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.4-5.1l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.6 5.1C9.6 39.5 16.3 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.4 4.3-4.4 5.7l6.2 5.2C36.9 36.3 44 31 44 24c0-1.2-.1-2.4-.4-3.5z"/>
            </svg>
            Continue with Google
        </button>

        <div class="divider"><span>or</span></div>

        <!-- LOGIN / REGISTER TABS -->
        <div class="tabs" id="auth-tabs">
            <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="tab-register" onclick="switchTab('register')">New Account</button>
        </div>

        <!-- LOGIN FORM (phone only) -->
        <form id="loginForm" onsubmit="sendOtpLogin(event)">
            <div class="form-group">
                <label>Mobile Number *</label>
                <div class="phone-wrap">
                    <span class="phone-flag">+91</span>
                    <input type="tel" id="login-phone" class="phone-input" placeholder="Your registered mobile number" maxlength="10" inputmode="numeric" pattern="[0-9]*" required />
                </div>
            </div>
            <button type="submit" class="btn" id="login-otp-btn">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.82 19.79 19.79 0 01.13 1.18 2 2 0 012.11 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.09a16 16 0 006 6l.55-.56a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92v2z"/></svg>
                Send OTP
            </button>
        </form>

        <!-- REGISTER FORM (full details) — hidden by default -->
        <form id="registerForm" class="hidden" onsubmit="sendOtpRegister(event)">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="fullName" placeholder="Enter your full name" />
            </div>
            <div class="form-group">
                <label>Email Address *</label>
                <input type="email" id="email" placeholder="your@email.com" />
            </div>
            <div class="form-group">
                <label>Mobile Number *</label>
                <div class="phone-wrap">
                    <span class="phone-flag">+91</span>
                    <input type="tel" id="phone" class="phone-input" placeholder="10-digit mobile number" maxlength="10" inputmode="numeric" pattern="[0-9]*" />
                </div>
            </div>
            <button type="submit" class="btn" id="register-otp-btn">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.82 19.79 19.79 0 01.13 1.18 2 2 0 012.11 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.09a16 16 0 006 6l.55-.56a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92v2z"/></svg>
                Send OTP
            </button>
        </form>

        <!-- OTP VERIFICATION STEP (shared, hidden initially) -->
        <div id="otp-step" class="hidden">
            <p class="otp-label">OTP sent to <span id="otp-phone">+91 XXXXXXXXXX</span> · Enter the 6-digit code</p>
            <div class="otp-inputs">
                <input class="otp-box" type="text" maxlength="1" inputmode="numeric" />
                <input class="otp-box" type="text" maxlength="1" inputmode="numeric" />
                <input class="otp-box" type="text" maxlength="1" inputmode="numeric" />
                <input class="otp-box" type="text" maxlength="1" inputmode="numeric" />
                <input class="otp-box" type="text" maxlength="1" inputmode="numeric" />
                <input class="otp-box" type="text" maxlength="1" inputmode="numeric" />
            </div>
            <button type="button" class="btn" id="otp-verify-btn" onclick="verifyOtp()">
                Verify & Sign In
            </button>
            <button type="button" class="back-btn" onclick="goBackToForm()">← Change details</button>
        </div>

        <div class="status" id="status"></div>
        <div style="margin-top: 18px; text-align: center;">
            <a href="https://wa.me/919008999968" target="_blank" style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b92a5; text-decoration: none;">
                Need help? Chat on WhatsApp →
            </a>
        </div>
    </div>

    <!-- reCAPTCHA & Firebase -->
    <script src="https://www.google.com/recaptcha/api.js?render=6Lcu4h4tAAAAAJUhr-BEXsXB4kmvnB2HkH2nFHTJ" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDyhtGPV8_OU7kgmz3SA4ixvv44PGVs2XA",
            authDomain: "legaldirectory-9e309.firebaseapp.com",
            projectId: "legaldirectory-9e309",
            storageBucket: "legaldirectory-9e309.firebasestorage.app",
            messagingSenderId: "661232836435",
            appId: "1:661232836435:web:ed75e0ee8c4c1189f48ba6"
        };

        let firebaseApp, firebaseAuth, googleProvider, recaptchaVerifier, confirmationResult;
        let _currentMode = 'login'; // 'login' | 'register'

        function initFirebase() {
            if (firebaseApp) return;
            firebaseApp = firebase.initializeApp(firebaseConfig);
            firebaseAuth = firebase.auth();
            googleProvider = new firebase.auth.GoogleAuthProvider();
            googleProvider.addScope('email');
            googleProvider.addScope('profile');
        }

        // ── TAB SWITCHING ──
        function switchTab(tab) {
            _currentMode = tab;
            document.getElementById('tab-login').classList.toggle('active', tab === 'login');
            document.getElementById('tab-register').classList.toggle('active', tab === 'register');
            document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
            document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
            document.getElementById('otp-step').classList.add('hidden');
            showStatus('');
        }

        // ── SHARED: fire OTP ──
        async function fireOtp(fullPhone, btnId, fallbackBtnHtml) {
            initFirebase();
            showStatus('');
            const btn = document.getElementById(btnId);
            btn.disabled = true;
            btn.innerHTML = '<span style="opacity:0.6">Sending OTP...</span>';

            try {
                if (recaptchaVerifier) { recaptchaVerifier.clear(); recaptchaVerifier = null; }
                recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', { size: 'invisible' }, firebaseApp);
                await recaptchaVerifier.render();
                confirmationResult = await firebaseAuth.signInWithPhoneNumber(fullPhone, recaptchaVerifier);

                // Hide both forms and tabs, show OTP step
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('registerForm').classList.add('hidden');
                document.getElementById('auth-tabs').classList.add('hidden');
                document.getElementById('otp-step').classList.remove('hidden');
                document.getElementById('otp-phone').textContent = fullPhone;
                setTimeout(() => document.querySelector('.otp-box')?.focus(), 100);
                setupOtpAutoSubmit();
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = fallbackBtnHtml;
                showStatus('Could not send OTP. Please check the number and try again.', 'error');
                if (recaptchaVerifier) { recaptchaVerifier.clear(); recaptchaVerifier = null; }
                console.error('OTP send error:', err);
            }
        }

        const OTP_BTN_HTML = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.82 19.79 19.79 0 01.13 1.18 2 2 0 012.11 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.09a16 16 0 006 6l.55-.56a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 14.92v2z"/></svg> Send OTP';

        // ── LOGIN: phone only ──
        async function sendOtpLogin(e) {
            e.preventDefault();
            const phone = document.getElementById('login-phone').value.trim().replace(/\D/g, '');
            if (phone.length !== 10) { showStatus('Please enter a valid 10-digit mobile number.', 'error'); return; }
            window._formData = { phone: '+91' + phone, mode: 'login' };
            await fireOtp('+91' + phone, 'login-otp-btn', OTP_BTN_HTML);
        }

        // ── REGISTER: full details ──
        async function sendOtpRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const email    = document.getElementById('email').value.trim();
            const phone    = document.getElementById('phone').value.trim().replace(/\D/g, '');
            if (!fullName)   { showStatus('Please enter your full name.', 'error'); return; }
            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showStatus('Please enter a valid email address.', 'error'); return; }
            if (phone.length !== 10) { showStatus('Please enter a valid 10-digit mobile number.', 'error'); return; }
            window._formData = { fullName, email, phone: '+91' + phone, mode: 'register' };
            await fireOtp('+91' + phone, 'register-otp-btn', OTP_BTN_HTML);
        }

        // ── SHARED OTP AUTO-SUBMIT ──
        function setupOtpAutoSubmit() {
            const boxes = document.querySelectorAll('.otp-box');
            boxes.forEach((box, i) => {
                // Remove old listeners by cloning
                const newBox = box.cloneNode(true);
                box.parentNode.replaceChild(newBox, box);
            });
            document.querySelectorAll('.otp-box').forEach((box, i) => {
                box.addEventListener('input', () => {
                    box.value = box.value.replace(/\D/, '').slice(-1);
                    if (box.value && i < 5) document.querySelectorAll('.otp-box')[i + 1].focus();
                    if ([...document.querySelectorAll('.otp-box')].every(b => b.value)) verifyOtp();
                });
                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !box.value && i > 0) document.querySelectorAll('.otp-box')[i - 1].focus();
                });
            });
        }

        // ── VERIFY OTP (handles both login and register) ──
        async function verifyOtp() {
            const boxes = document.querySelectorAll('.otp-box');
            const code  = [...boxes].map(b => b.value).join('');
            if (code.length < 6) { showStatus('Please enter all 6 digits.', 'error'); return; }

            const btn = document.getElementById('otp-verify-btn');
            btn.disabled = true;
            btn.innerHTML = '<span style="opacity:0.6">Verifying...</span>';
            showStatus('');

            try {
                const result = await confirmationResult.confirm(code);
                const user   = result.user;
                const { fullName, email, phone, mode } = window._formData || {};
                const ts = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
                const isNew = result.additionalUserInfo?.isNewUser;

                if (mode === 'register' && fullName) {
                    // New account — save display name and notify admin
                    try { await user.updateProfile({ displayName: fullName }); } catch(e) {}
                    sendEmail(
                        `New Account Created — ${fullName} — Legaldirectory.ai`,
                        `<div style="font-family:sans-serif;max-width:520px;"><h2 style="color:#d4a843;">New Account Created</h2><table style="width:100%;border-collapse:collapse;font-size:14px;"><tr><td style="padding:8px;color:#888;">Name</td><td style="padding:8px;font-weight:bold;">${fullName}</td></tr><tr style="background:#f9f9f9;"><td style="padding:8px;color:#888;">Email</td><td style="padding:8px;">${email}</td></tr><tr><td style="padding:8px;color:#888;">Phone</td><td style="padding:8px;">${phone}</td></tr><tr style="background:#f9f9f9;"><td style="padding:8px;color:#888;">Time (IST)</td><td style="padding:8px;">${ts}</td></tr></table></div>`
                    );
                    setTimeout(() => sendWhatsApp(`*New Account — Legaldirectory.ai*\n\nName: ${fullName}\nEmail: ${email}\nPhone: ${phone}\nTime: ${ts}\n\nAccount verified.`), 700);
                    showStatus(`Welcome, ${fullName.split(' ')[0]}! Account created successfully.`, 'success');
                } else {
                    // Returning user login
                    const name = user.displayName || 'there';
                    sendEmail(
                        `Login — ${name} — Legaldirectory.ai`,
                        `<div style="font-family:sans-serif;"><h2 style="color:#d4a843;">User Logged In</h2><p>Name: ${name}</p><p>Phone: ${phone || user.phoneNumber}</p><p>Time: ${ts}</p></div>`
                    );
                    showStatus(`Welcome back, ${name.split(' ')[0]}!`, 'success');
                }

                setTimeout(() => location.reload(), 2000);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = 'Verify & Sign In';
                showStatus('Incorrect OTP. Please try again.', 'error');
                console.error('OTP verify error:', err);
            }
        }

        // ── BACK TO FORM ──
        function goBackToForm() {
            document.getElementById('otp-step').classList.add('hidden');
            document.getElementById('auth-tabs').classList.remove('hidden');
            if (_currentMode === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
            } else {
                document.getElementById('registerForm').classList.remove('hidden');
            }
            document.querySelectorAll('.otp-box').forEach(b => b.value = '');
            showStatus('');
        }

        function showStatus(msg, type = '') {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status' + (type ? ' ' + type : '');
        }

        // ── GOOGLE SIGN-IN ──
        async function signInWithGoogle() {
            initFirebase();
            const btn = document.getElementById('google-signin-btn');
            btn.disabled = true;
            btn.innerHTML = '<span style="opacity:0.6">Connecting...</span>';
            showStatus('');
            try {
                const result = await firebaseAuth.signInWithPopup(googleProvider);
                const name   = result.user.displayName || 'User';
                const ts     = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
                sendEmail(`Google Login — ${name} — Legaldirectory.ai`,
                    `<div style="font-family:sans-serif;"><h2 style="color:#d4a843;">Google Login</h2><p>Name: ${name}</p><p>Email: ${result.user.email}</p><p>Time: ${ts}</p></div>`
                );
                showStatus(`Welcome, ${name.split(' ')[0]}!`, 'success');
                setTimeout(() => location.reload(), 2000);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<svg width="19" height="19" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19.1 13 24 13c3.1 0 5.8 1.1 7.9 3l5.7-5.7C34.1 6.5 29.3 4 24 4 16.3 4 9.7 8.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-1.9 13.4-5.1l-6.2-5.2C29.4 35.5 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.6 5.1C9.6 39.5 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.4 4.3-4.4 5.7l6.2 5.2C36.9 36.3 44 31 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg> Continue with Google';
                showStatus('Google sign-in failed. Please try again.', 'error');
            }
        }

        async function sendEmail(subject, html) {
            try {
                await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        access_key: '645e6ea8-caec-463c-a1bd-9ce5b68106d2',
                        to: 'weightage.lab@gmail.com',
                        subject, html,
                        from_name: 'Legaldirectory.ai'
                    })
                });
            } catch (err) { console.error('Email failed:', err); }
        }

        function sendWhatsApp(msg) {
            window.open('https://wa.me/919008999968?text=' + encodeURIComponent(msg), '_blank');
        }

        window.addEventListener('load', initFirebase);
    </script>

    <!-- reCAPTCHA container -->
    <div id="recaptcha-container" style="position:fixed;bottom:0;right:0;z-index:9999;"></div>
</body>
</html>
