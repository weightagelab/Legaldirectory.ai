<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://checkout.razorpay.com/v1/checkout.js"></script><title>Cart</title><style>body{background:#07080e;color:#fff;font-family:Arial;max-width:700px;margin:40px auto;padding:20px}button,input{padding:12px;margin:6px;border-radius:6px}button{background:#3b82f6;color:#fff;border:0}input{width:95%;background:#12141f;color:#fff;border:1px solid #333}.row{padding:12px;border-bottom:1px solid #333}</style><h1>Your Cart</h1><div id="items"></div><h2 id="total"></h2><input id="name" placeholder="Name"><input id="phone" placeholder="Mobile number"><button onclick="pay()">Pay with Razorpay</button><script>
const K='ld_cart_v1',get=()=>JSON.parse(localStorage.getItem(K)||'[]');function render(){let c=get(),t=c.reduce((a,x)=>a+x.price*x.qty,0);items.innerHTML=c.map(x=>`<div class=row>${x.name} × ${x.qty} — ₹${x.price*x.qty}</div>`).join('')||'Cart is empty';total.textContent='Total: ₹'+t}async function pay(){let c=get(),amount=c.reduce((a,x)=>a+x.price*x.qty,0),name=document.getElementById('name').value,phone=document.getElementById('phone').value;if(!c.length||!name||!phone)return alert('Add services, name and mobile number');let r=await fetch('/api/create-order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount,receipt:'LD-'+Date.now(),notes:{services:c.map(x=>x.name).join(',')}})}),o=await r.json();if(!r.ok)return alert(o.error);new Razorpay({key:o.key_id,amount:o.amount,currency:o.currency,name:'Legaldirectory.ai',order_id:o.order_id,prefill:{name,contact:phone},handler:async x=>{let v=await fetch('/api/verify-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...x,service:c.map(i=>i.name).join(', '),amount,customer:{name,phone}})});let d=await v.json();if(d.success){localStorage.removeItem(K);alert('Payment verified');location.href='/'}else alert(d.error)}}).open()}render()</script>
